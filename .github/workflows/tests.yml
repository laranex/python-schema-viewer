name: tests
on:
  push:
  pull_request:
  workflow_call:
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - run: python scripts/check_wheel.py
  databases:
    # Introspection, read-only enforcement and reconciliation against disposable servers (synthetic schemas only).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env: {POSTGRES_PASSWORD: lsv-admin, POSTGRES_DB: lsv}
        ports: ['55432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      mysql:
        image: mysql:8.4.6
        env: {MYSQL_ROOT_PASSWORD: lsv-admin, MYSQL_DATABASE: lsv}
        ports: ['53306:3306']
        options: --health-cmd "mysqladmin ping -plsv-admin" --health-interval 5s --health-retries 30
      mariadb:
        image: mariadb:11.4.8
        env: {MARIADB_ROOT_PASSWORD: lsv-admin, MARIADB_DATABASE: lsv}
        ports: ['53307:3306']
        options: --health-cmd "healthcheck.sh --connect" --health-interval 5s --health-retries 30
    env:
      LSV_TEST_POSTGRES_URL: postgresql+psycopg://postgres:lsv-admin@127.0.0.1:55432/lsv
      LSV_TEST_MYSQL_URL: mysql+pymysql://root:lsv-admin@127.0.0.1:53306/lsv
      LSV_TEST_MARIADB_URL: mysql+pymysql://root:lsv-admin@127.0.0.1:53307/lsv
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install -e '.[dev]'
      - run: python -m unittest tests.test_introspection tests.test_reconcile tests.test_cli_database tests.test_multiconnection -v
  viewer:
    # The vendored shared viewer in headless Chrome (preinstalled on ubuntu-latest) for declared, database and
    # combined documents.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: pip install -e '.[dev]'
      - run: python -m unittest tests.test_browser -v
        env:
          LSV_BROWSER: '1'
          CHROME_BIN: google-chrome
