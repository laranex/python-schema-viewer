name: Documentation Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.gh-page/**'
      - 'ui.lock.json'
      - 'scripts/fetch_ui.py'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.gh-page/**'
      - 'ui.lock.json'
      - 'scripts/fetch_ui.py'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Check and build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .gh-page
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch the shared UI from the npm tarball ui.lock.json pins (the demo serves its viewer)
        working-directory: .
        run: python3 scripts/fetch_ui.py
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .gh-page/package-lock.json
      - name: Install documentation dependencies
        run: npm ci
      - name: Test, build, and verify production links
        run: npm run check
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .gh-page/.vitepress/dist

  deploy:
    name: Deploy documentation
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
