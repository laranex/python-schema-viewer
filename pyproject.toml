[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "laranex-schema-viewer"
version = "0.3.0"
description = "Schema snapshots, an ERD viewer, and read-only MCP tools for SQLAlchemy, SQLModel, Django, Tortoise ORM, and Peewee"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["sqlalchemy", "sqlmodel", "django", "tortoise-orm", "peewee", "erd", "schema", "database", "mcp"]
authors = [{name = "Soe Thura", email = "thixpin@gmail.com"}]
dependencies = ["pydantic>=2.7,<3", "tomli>=1.1; python_version < '3.11'"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Framework :: Django",
  "Topic :: Database",
  "Topic :: Software Development :: Documentation",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/laranex/python-schema-viewer"
Documentation = "https://laranex.github.io/python-schema-viewer/"
Repository = "https://github.com/laranex/python-schema-viewer"
Issues = "https://github.com/laranex/python-schema-viewer/issues"
Changelog = "https://github.com/laranex/python-schema-viewer/blob/main/CHANGELOG.md"

[project.optional-dependencies]
sqlalchemy = ["SQLAlchemy>=2.0,<3"]
sqlmodel = ["SQLAlchemy>=2.0,<3", "sqlmodel>=0.0.22,<0.1"]
django = ["Django>=4.2,<7"]
tortoise = ["tortoise-orm>=1.0,<2"]
peewee = ["peewee>=3.19,<5"]
mcp = ["mcp>=2.3,<3"]
dev = ["SQLAlchemy>=2.0,<3", "sqlmodel>=0.0.22,<0.1", "Django>=4.2,<7", "tortoise-orm>=1.0,<2", "peewee>=3.19,<5", "mcp>=2.3,<3", "ruff>=0.8,<0.18", "build>=1.2", "PyYAML>=6,<7"]

[project.scripts]
laranex-schema-viewer = "laranex_schema_viewer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/laranex_schema_viewer"]

[tool.hatch.build.targets.sdist]
exclude = ["/.agents", "/.claude", "/.validation"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]


